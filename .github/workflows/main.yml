name: Build Ultralight Samples

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set current timestamp
        id: timestamp
        shell: pwsh
        run: |
          $currentTimestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH-mm")
          echo "BUILD_TIMESTAMP=$currentTimestamp" >> $env:GITHUB_ENV

      - name: Download Ultralight SDK
        shell: pwsh
        run: |
          $url = "https://ultralight-sdk.sfo2.cdn.digitaloceanspaces.com/ultralight-sdk-latest-win-x64.7z"
          Invoke-WebRequest -Uri $url -OutFile "ultralight-sdk.7z"

      - name: Extract SDK
        shell: pwsh
        run: |
          7z x ultralight-sdk.7z -osdk

      - name: Configure CMake
        working-directory: sdk
        shell: pwsh
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"

          Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              $text = $text -replace 'cmake_minimum_required\s*\([^)]*\)', 'cmake_minimum_required(VERSION 3.15)'
              Set-Content -Path $_.FullName -Value $text -NoNewline
          }

          cmake -B build -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Samples (Release)
        working-directory: sdk
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Output Package
        shell: pwsh
        run: |
          $outDir = "ultralight-samples-$($env:BUILD_TIMESTAMP)"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          # Find SDK resource/bin folders
          $sdkResources = (Get-ChildItem -Path 'sdk' -Recurse -Directory -Filter 'resources' | Select-Object -First 1).FullName
          $sdkInspector = (Get-ChildItem -Path 'sdk' -Recurse -Directory -Filter 'inspector' | Select-Object -First 1).FullName
          $sdkDlls = Get-ChildItem -Path 'sdk' -Recurse -Filter '*.dll'

          # Process each sample directory under sdk/samples
          Get-ChildItem -Path 'sdk/samples' -Directory | ForEach-Object {
              $sampleDir = $_
              $sampleName = $sampleDir.Name
              $targetSampleDir = Join-Path $outDir $sampleName
              New-Item -ItemType Directory -Path $targetSampleDir -Force | Out-Null

              # 1. Copy sample-specific assets if present
              $assetsDir = Join-Path $sampleDir.FullName 'assets'
              if (Test-Path $assetsDir) {
                  $targetAssets = Join-Path $targetSampleDir 'assets'
                  Copy-Item -Path $assetsDir -Destination $targetAssets -Recurse -Force

                  # Copy resources into assets/resources for AppCore file_system_path
                  if ($sdkResources) {
                      Copy-Item -Path $sdkResources -Destination (Join-Path $targetAssets 'resources') -Recurse -Force
                  }
              }

              # 2. Copy root resources & inspector
              if ($sdkResources) {
                  Copy-Item -Path $sdkResources -Destination (Join-Path $targetSampleDir 'resources') -Recurse -Force
              }
              if ($sdkInspector) {
                  Copy-Item -Path $sdkInspector -Destination (Join-Path $targetSampleDir 'inspector') -Recurse -Force
              }

              # 3. Copy all runtime DLLs
              foreach ($dll in $sdkDlls) {
                  Copy-Item -Path $dll.FullName -Destination $targetSampleDir -Force
              }
          }

          # 4. Find all compiled .exe files and place them into their corresponding sample folders
          Get-ChildItem -Path 'sdk/build' -Recurse -Filter '*.exe' | ForEach-Object {
              $exeFile = $_
              $exeNameNoExt = [System.IO.Path]::GetFileNameWithoutExtension($exeFile.Name)

              # Match executable with its target directory (or fall back to output root)
              $matchedDir = Get-ChildItem -Path $outDir -Directory | Where-Object {
                  $_.Name -like "*$exeNameNoExt*" -or $exeNameNoExt -like "*$($_.Name)*"
              } | Select-Object -First 1

              if ($matchedDir) {
                  Copy-Item -Path $exeFile.FullName -Destination $matchedDir.FullName -Force
              } else {
                  Copy-Item -Path $exeFile.FullName -Destination $outDir -Force
              }
          }

      - name: Upload Timestamped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-samples-win-x64-${{ env.BUILD_TIMESTAMP }}
          path: ultralight-samples-${{ env.BUILD_TIMESTAMP }}
          retention-days: 30
