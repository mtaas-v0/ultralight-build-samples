name: Build Ultralight Samples

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set current date
        id: date
        shell: pwsh
        run: |
          $currentDate = Get-Date -Format "yyyy-MM-dd"
          echo "BUILD_DATE=$currentDate" >> $env:GITHUB_ENV

      - name: Download Ultralight SDK
        shell: pwsh
        run: |
          $url = "https://ultralight-sdk.sfo2.cdn.digitaloceanspaces.com/ultralight-sdk-latest-win-x64.7z"
          Invoke-WebRequest -Uri $url -OutFile "ultralight-sdk.7z"

      - name: Extract SDK
        shell: pwsh
        run: |
          7z x ultralight-sdk.7z -osdk

      - name: Configure CMake
        working-directory: sdk
        shell: pwsh
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"

          Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              $text = $text -replace 'cmake_minimum_required\s*\([^)]*\)', 'cmake_minimum_required(VERSION 3.15)'
              Set-Content -Path $_.FullName -Value $text -NoNewline
          }

          cmake -B build -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Samples (Release)
        working-directory: sdk
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Output Package
        shell: pwsh
        run: |
          $distDir = "ultralight-samples-${{ env.BUILD_DATE }}"
          New-Item -ItemType Directory -Path $distDir -Force

          # 1. Copy built executables (.exe)
          Get-ChildItem -Path "sdk/build" -Recurse -Filter "*.exe" | ForEach-Object {
              Copy-Item $_.FullName -Destination $distDir -Force
          }

          # 2. Copy required runtime DLLs
          Get-ChildItem -Path "sdk" -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $distDir -Force
          }

