name: Build Ultralight Samples

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set current date
        id: date
        shell: pwsh
        run: |
          $currentDate = Get-Date -Format "yyyy-MM-dd"
          echo "BUILD_DATE=$currentDate" >> $env:GITHUB_ENV

      - name: Download Ultralight SDK
        shell: pwsh
        run: |
          $url = "https://ultralight-sdk.sfo2.cdn.digitaloceanspaces.com/ultralight-sdk-latest-win-x64.7z"
          Invoke-WebRequest -Uri $url -OutFile "ultralight-sdk.7z"

      - name: Extract SDK
        shell: pwsh
        run: |
          7z x ultralight-sdk.7z -osdk

      - name: Configure CMake
        working-directory: sdk
        shell: pwsh
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"

          Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              $text = $text -replace 'cmake_minimum_required\s*\([^)]*\)', 'cmake_minimum_required(VERSION 3.15)'
              Set-Content -Path $_.FullName -Value $text -NoNewline
          }

          cmake -B build -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Samples (Release)
        working-directory: sdk
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Output Package
        shell: pwsh
        run: |
          $outDir = "ultralight-samples-$($env:BUILD_DATE)"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          # Copy executables
          Get-ChildItem -Path 'sdk/build' -Recurse -Filter '*.exe' | ForEach-Object {
              Copy-Item $_.FullName -Destination $outDir -Force
          }

          # Copy runtime DLLs
          Get-ChildItem -Path 'sdk' -Recurse -Filter '*.dll' | ForEach-Object {
              Copy-Item $_.FullName -Destination $outDir -Force
          }

          # Copy top-level resources/assets
          @('resources', 'inspector', 'assets') | ForEach-Object {
              $src = Join-Path 'sdk' $_
              if (Test-Path $src) {
                  Copy-Item -Path $src -Destination (Join-Path $outDir $_) -Recurse -Force
              }
              $binSrc = Join-Path 'sdk/bin' $_
              if (Test-Path $binSrc) {
                  Copy-Item -Path $binSrc -Destination (Join-Path $outDir $_) -Recurse -Force
              }
          }

          # Copy sample-specific assets
          Get-ChildItem -Path 'sdk/samples' -Recurse -Directory -Filter 'assets' | ForEach-Object {
              $sampleName = $_.Parent.Name
              $target = Join-Path $outDir "samples/$sampleName"
              New-Item -ItemType Directory -Path $target -Force | Out-Null
              Copy-Item -Path $_.FullName -Destination $target -Recurse -Force
          }

          Compress-Archive -Path "$outDir/*" -DestinationPath "$outDir.zip" -Force

      - name: Upload Dated Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-samples-win-x64-${{ env.BUILD_DATE }}
          path: ultralight-samples-${{ env.BUILD_DATE }}.zip
          retention-days: 30
