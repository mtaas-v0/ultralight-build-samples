name: Build Ultralight Samples

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Runs on the 1st of every month at midnight UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set current timestamp
        id: timestamp
        shell: pwsh
        run: |
          $currentTimestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH-mm")
          echo "BUILD_TIMESTAMP=$currentTimestamp" >> $env:GITHUB_ENV

      - name: Download Ultralight SDK
        shell: pwsh
        run: |
          $url = "https://ultralight-sdk.sfo2.cdn.digitaloceanspaces.com/ultralight-sdk-latest-win-x64.7z"
          Invoke-WebRequest -Uri $url -OutFile "ultralight-sdk.7z"

      - name: Extract SDK
        shell: pwsh
        run: |
          7z x ultralight-sdk.7z -osdk

      - name: Configure CMake
        working-directory: sdk
        shell: pwsh
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"

          Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              $text = $text -replace 'cmake_minimum_required\s*\([^)]*\)', 'cmake_minimum_required(VERSION 3.15)'
              Set-Content -Path $_.FullName -Value $text -NoNewline
          }

          cmake -B build -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Samples (Release)
        working-directory: sdk
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Output Package
        shell: pwsh
        run: |
          $outDir = "ultralight-samples-$($env:BUILD_TIMESTAMP)"
          $sharedDir = Join-Path $outDir "_shared"
          New-Item -ItemType Directory -Path $sharedDir -Force | Out-Null

          # 1. Copy DLLs to _shared
          Write-Host "--- Collecting DLLs into _shared ---"
          Get-ChildItem -Path 'sdk' -Recurse -Filter '*.dll' | ForEach-Object {
              Copy-Item $_.FullName -Destination $sharedDir -Force
              Write-Host "  Copied DLL: $($_.Name)"
          }

          # 2. Copy resources & inspector to _shared
          $resSrc = (Get-ChildItem -Path 'sdk' -Recurse -Directory -Filter 'resources' | Select-Object -First 1).FullName
          if ($resSrc) {
              Copy-Item -Path $resSrc -Destination (Join-Path $sharedDir 'resources') -Recurse -Force
          }
          $inspSrc = (Get-ChildItem -Path 'sdk' -Recurse -Directory -Filter 'inspector' | Select-Object -First 1).FullName
          if ($inspSrc) {
              Copy-Item -Path $inspSrc -Destination (Join-Path $sharedDir 'inspector') -Recurse -Force
          }

          # 3. Create diagnostic inflate.bat template
          $inflateBat = @'
          @echo off
          setlocal enabledelayedexpansion
          
          echo ======================================================
          echo           Ultralight Sample Inflate ^& Run            
          echo ======================================================
          echo Current Dir: "%~dp0"
          set "SHARED_DIR=%~dp0..\_shared"
          echo Shared Dir:  "!SHARED_DIR!"
          
          if not exist "!SHARED_DIR!" (
              echo [ERROR] Shared directory not found at "!SHARED_DIR!"!
              goto :error
          )
          
          echo.
          echo --- Checking DLLs in _shared ---
          dir /b "!SHARED_DIR!\*.dll" 2>nul
          if errorlevel 1 (
              echo [ERROR] No DLLs found in "!SHARED_DIR!"!
              goto :error
          )
          
          echo.
          echo --- Copying DLLs ---
          copy /Y "!SHARED_DIR!\*.dll" "%~dp0"
          
          echo.
          echo --- Copying Resources ---
          if exist "!SHARED_DIR!\resources" (
              xcopy /E /I /Y "!SHARED_DIR!\resources" "%~dp0resources"
              xcopy /E /I /Y "!SHARED_DIR!\resources" "%~dp0assets\resources"
          ) else (
              echo [WARNING] No resources folder in _shared!
          )
          
          if exist "!SHARED_DIR!\inspector" (
              xcopy /E /I /Y "!SHARED_DIR!\inspector" "%~dp0inspector"
          )
          
          echo.
          echo --- Finding Executable ---
          set "FOUND_EXE="
          for %%f in ("%~dp0*.exe") do (
              set "FOUND_EXE=%%~nxf"
              echo Found executable: %%~nxf
          )
          
          if not defined FOUND_EXE (
              echo [ERROR] No .exe found in "%~dp0"!
              goto :error
          )
          
          echo.
          echo ======================================================
          echo Launching: !FOUND_EXE!
          echo ======================================================
          cd /d "%~dp0"
          start "" "%~dp0!FOUND_EXE!"
          exit /b 0
          
          :error
          echo.
          echo [FAILED] Something went wrong during inflation.
          pause
          exit /b 1
          '@

          # 4. Create sample directories and copy assets
          Get-ChildItem -Path 'sdk/samples' -Directory | ForEach-Object {
              $sampleDir = $_
              $sampleName = $sampleDir.Name
              $targetSampleDir = Join-Path $outDir $sampleName
              New-Item -ItemType Directory -Path $targetSampleDir -Force | Out-Null

              # Copy sample assets
              $assetsDir = Join-Path $sampleDir.FullName 'assets'
              if (Test-Path $assetsDir) {
                  Copy-Item -Path $assetsDir -Destination (Join-Path $targetSampleDir 'assets') -Recurse -Force
              }

              # Write inflate.bat
              [System.IO.File]::WriteAllText((Join-Path $targetSampleDir "inflate.bat"), $inflateBat, [System.Text.Encoding]::ASCII)
          }

          # 5. Search for compiled .exe files across the SDK (excluding CMakeFiles internal tests)
          Write-Host "--- Finding compiled .exe files ---"
          Get-ChildItem -Path 'sdk' -Recurse -Filter '*.exe' | Where-Object { $_.FullName -notmatch 'CMakeFiles' } | ForEach-Object {
              $exeFile = $_
              Write-Host "Found EXE: $($exeFile.FullName)"
              $exeNameNoExt = [System.IO.Path]::GetFileNameWithoutExtension($exeFile.Name)

              # Match executable with its target sample directory
              $matchedDir = Get-ChildItem -Path $outDir -Directory | Where-Object {
                  $_.Name -ne '_shared' -and (
                      $_.Name -like "*$exeNameNoExt*" -or 
                      $exeNameNoExt -like "*$($_.Name)*" -or 
                      $exeNameNoExt.Replace(' ','') -like "*$($_.Name.Replace(' ',''))*"
                  )
              } | Select-Object -First 1

              if ($matchedDir) {
                  Write-Host "  -> Copying to $($matchedDir.FullName)"
                  Copy-Item -Path $exeFile.FullName -Destination $matchedDir.FullName -Force
              } else {
                  Write-Host "  -> No matching sample folder for $($exeFile.Name), placing at output root"
                  Copy-Item -Path $exeFile.FullName -Destination $outDir -Force
              }
          }

      - name: Upload Timestamped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-samples-win-x64-${{ env.BUILD_TIMESTAMP }}
          path: ultralight-samples-${{ env.BUILD_TIMESTAMP }}
          retention-days: 30
