name: Build Ultralight Samples

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set current timestamp
        id: timestamp
        shell: pwsh
        run: |
          # Generates format: YYYY-MM-DD_HH-mm (in UTC)
          $currentTimestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH-mm")
          echo "BUILD_TIMESTAMP=$currentTimestamp" >> $env:GITHUB_ENV

      - name: Download Ultralight SDK
        shell: pwsh
        run: |
          $url = "https://ultralight-sdk.sfo2.cdn.digitaloceanspaces.com/ultralight-sdk-latest-win-x64.7z"
          Invoke-WebRequest -Uri $url -OutFile "ultralight-sdk.7z"

      - name: Extract SDK
        shell: pwsh
        run: |
          7z x ultralight-sdk.7z -osdk

      - name: Configure CMake
        working-directory: sdk
        shell: pwsh
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"

          Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
              $text = Get-Content $_.FullName -Raw
              $text = $text -replace 'cmake_minimum_required\s*\([^)]*\)', 'cmake_minimum_required(VERSION 3.15)'
              Set-Content -Path $_.FullName -Value $text -NoNewline
          }

          cmake -B build -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Prepare Output Package
        shell: pwsh
        run: |
          $outDir = "ultralight-samples-$($env:BUILD_TIMESTAMP)"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          # 1. Copy all compiled executables (.exe)
          Get-ChildItem -Path 'sdk/build' -Recurse -Filter '*.exe' | ForEach-Object {
              Copy-Item $_.FullName -Destination $outDir -Force
          }

          # 2. Copy all runtime DLLs
          Get-ChildItem -Path 'sdk' -Recurse -Filter '*.dll' | ForEach-Object {
              Copy-Item $_.FullName -Destination $outDir -Force
          }

          # 3. Copy top-level resources, inspector, and assets
          @('resources', 'inspector', 'assets') | ForEach-Object {
              $src = Join-Path 'sdk' $_
              if (Test-Path $src) {
                  Copy-Item -Path $src -Destination (Join-Path $outDir $_) -Recurse -Force
              }
              $binSrc = Join-Path 'sdk/bin' $_
              if (Test-Path $binSrc) {
                  Copy-Item -Path $binSrc -Destination (Join-Path $outDir $_) -Recurse -Force
              }
          }

          # 4. FIX: Place resources inside assets/ for AppCore's file_system_path resolution
          $resSrc = Join-Path $outDir 'resources'
          if (Test-Path $resSrc) {
              $assetsResDir = Join-Path $outDir 'assets/resources'
              New-Item -ItemType Directory -Path (Split-Path $assetsResDir) -Force | Out-Null
              Copy-Item -Path $resSrc -Destination $assetsResDir -Recurse -Force
          }

          # 5. Copy sample-specific HTML/CSS assets and inject resources folder into each
          Get-ChildItem -Path 'sdk/samples' -Recurse -Directory -Filter 'assets' | ForEach-Object {
              $sampleName = $_.Parent.Name
              $targetDir = Join-Path $outDir "samples/$sampleName/assets"
              New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
              Copy-Item -Path "$($_.FullName)/*" -Destination $targetDir -Recurse -Force

              # Also copy resources into the sample assets folder
              if (Test-Path $resSrc) {
                  Copy-Item -Path $resSrc -Destination (Join-Path $targetDir 'resources') -Recurse -Force
              }
          }
          

      - name: Upload Timestamped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-samples-win-x64-${{ env.BUILD_TIMESTAMP }}
          path: ultralight-samples-${{ env.BUILD_TIMESTAMP }}
          retention-days: 30
